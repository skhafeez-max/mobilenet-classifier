<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobileNet Image Classifier</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <h1>MobileNet Image Classifier</h1>

        <p>
            Upload an image and let MobileNetV2 predict what it contains.
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button onclick="predictImage()">
                Predict Image
            </button>

        </div>

        <div id="preview"></div>

        <div id="result">
            <h2>Prediction Result</h2>
            <p id="message">Please upload an image.</p>
        </div>

    </div>

    <script src="/js/script.js"></script>

</body>
</html>
